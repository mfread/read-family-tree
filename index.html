<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <title>Read Family Tree v0.095</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/family-chart@0.9.0/dist/styles/family-chart.css">
  <script type="importmap">
  {
    "imports": {
      "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm"
    }
  }
  </script>
</head>
<body data-theme="dark">
  <div id="login-overlay">
    <div id="login-box">
      <h2>Read Family Tree</h2>
      <p>Sign in to view</p>
      <form id="login-form">
        <input type="email" id="email" placeholder="Email" required autocomplete="email">
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
        <button type="submit" id="login-btn">Sign in</button>
        <button type="button" id="signup-btn">Create account</button>
      </form>
      <p id="auth-error"></p>
    </div>
  </div>

  <div id="app" style="display:none;">
    <div id="header">
      <h1>Read Family Tree</h1>
      <span id="user-email"></span>
      <div id="view-controls">
        <span>View:</span>
        <button id="view-both" class="view-btn active">Both</button>
        <button id="view-paternal" class="view-btn">Paternal</button>
        <button id="view-maternal" class="view-btn">Maternal</button>
      </div>
      <button id="logout-btn">Sign out</button>
      <button id="theme-toggle">Toggle Theme</button>
      <button id="export-btn">Export JSON</button>
      <button id="reset-btn">Reset</button>
    </div>
    <div id="chart" class="f3" style="width:100%;height:calc(100vh - 50px);margin-top:50px;"></div>
    <div id="footer">v0.095 • Powered by family-chart</div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
